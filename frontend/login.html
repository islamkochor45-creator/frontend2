<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ярмарка — вход</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">Я<span>Р</span>МАРКА</div>
  <nav class="main-nav">
    <a href="index.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="wishlist.html">Избранное</a>
    <a href="orders.html">Заказы</a>
  </nav>
  <div class="header-actions">
    <div id="userSlot"></div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Вход</h1>
    <p class="hint">Рады видеть вас снова на ярмарке</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="fEmail">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <div class="field-error">Введите корректный email</div>
      </div>
      <div class="field" id="fPassword">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <div class="field-error">Введите пароль</div>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;" id="submitBtn">Войти</button>
    </form>

    <div class="auth-switch">Ещё нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
  </div>
</main>

<script type="module">
  import { api } from './js/api.js';
  import { initHeader } from './js/header.js';
  import { initWidgets } from './js/widgets.js';

  initHeader();
  initWidgets();

  const form = document.getElementById('loginForm');
  const formError = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  function setFieldError(fieldId, has) {
    document.getElementById(fieldId).classList.toggle('error', has);
  }

  function validate() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let ok = true;

    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    setFieldError('fEmail', !emailValid);
    if (!emailValid) ok = false;

    setFieldError('fPassword', !password);
    if (!password) ok = false;

    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.remove('show');
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Входим…';

    try {
      await api.login({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = 'index.html';
    } catch (err) {
      formError.textContent = err.message || 'Неверный email или пароль';
      formError.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Войти';
    }
  });
</script>

</body>
</html>
