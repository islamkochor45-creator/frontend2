<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ярмарка — заказ оформлен</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">Я<span>Р</span>МАРКА</div>
  <nav class="main-nav">
    <a href="index.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="wishlist.html">Избранное</a>
    <a href="orders.html">Заказы</a>
  </nav>
  <div class="header-actions">
    <div id="userSlot"></div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card" style="text-align:center;">
    <h1 id="title">Заказ оформлен 🎉</h1>
    <p class="hint" id="orderInfo">Мы отправили подтверждение и будем держать вас в курсе статуса.</p>
    <a href="index.html" class="btn-primary" style="display:inline-block; margin-top:10px;">Вернуться в каталог</a>
  </div>
</main>

<script type="module">
  import { initHeader } from './js/header.js';
  import { initWidgets } from './js/widgets.js';
  initHeader();
  initWidgets();

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  if (orderId) {
    document.getElementById('orderInfo').textContent = `Номер заказа: #${orderId}. Мы отправили подтверждение и будем держать вас в курсе статуса.`;
  }
</script>

</body>
</html>
