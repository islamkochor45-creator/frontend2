<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ярмарка — восстановление пароля</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">Я<span>Р</span>МАРКА</div>
      <nav class="main-nav">
        <a href="index.html">Каталог</a>
        <a href="login.html">Войти</a>
      </nav>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <h1 id="title">Сброс пароля</h1>
        <p class="hint" id="hint">Укажите email, и мы отправим ссылку для восстановления.</p>
        <div class="form-error" id="formError"></div>
        <div class="form-success" id="formSuccess"></div>

        <form id="resetForm" novalidate>
          <div class="field" id="emailField">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email" />
            <div class="field-error">Введите корректный email</div>
          </div>
          <div class="field" id="passwordField" style="display: none">
            <label for="password">Новый пароль</label>
            <input type="password" id="password" minlength="8" autocomplete="new-password" />
            <div class="field-error">Минимум 8 символов</div>
          </div>
          <div class="field" id="passwordConfirmField" style="display: none">
            <label for="passwordConfirm">Повторите пароль</label>
            <input type="password" id="passwordConfirm" minlength="8" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn-primary" style="width: 100%" id="submitBtn">Отправить ссылку</button>
        </form>
      </div>
    </main>

    <script type="module">
      import { api } from "./js/api.js";

      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid");
      const token = params.get("token");
      const isConfirm = Boolean(uid && token);
      const form = document.getElementById("resetForm");
      const error = document.getElementById("formError");
      const success = document.getElementById("formSuccess");
      const submit = document.getElementById("submitBtn");
      const emailField = document.getElementById("emailField");
      const passwordField = document.getElementById("passwordField");
      const passwordConfirmField = document.getElementById("passwordConfirmField");
      const title = document.getElementById("title");
      const hint = document.getElementById("hint");

      if (isConfirm) {
        title.textContent = "Новый пароль";
        hint.textContent = "Придумайте новый пароль для аккаунта.";
        emailField.style.display = "none";
        passwordField.style.display = "block";
        passwordConfirmField.style.display = "block";
        submit.textContent = "Сохранить пароль";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.classList.remove("show");
        success.classList.remove("show");

        try {
          submit.disabled = true;
          if (isConfirm) {
            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("passwordConfirm").value;
            if (password.length < 8 || password !== passwordConfirm) {
              passwordField.classList.add("error");
              return;
            }
            await api.confirmPasswordReset({ uid, token, new_password: password, new_password_confirm: passwordConfirm });
            success.textContent = "Пароль изменён. Теперь можно войти.";
            success.classList.add("show");
            form.style.display = "none";
          } else {
            const email = document.getElementById("email").value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              emailField.classList.add("error");
              return;
            }
            await api.requestPasswordReset(email);
            success.textContent = "Если аккаунт существует, ссылка отправлена на почту.";
            success.classList.add("show");
          }
        } catch (err) {
          error.textContent = err.message || "Не удалось выполнить операцию";
          error.classList.add("show");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
