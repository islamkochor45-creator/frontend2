<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ярмарка — избранное</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">Я<span>Р</span>МАРКА</div>
  <nav class="main-nav">
    <a href="index.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="wishlist.html" class="active">Избранное</a>
    <a href="orders.html">Заказы</a>
  </nav>
  <div class="header-actions">
    <div id="userSlot"></div>
    <a href="cart.html" class="cart-btn">Корзина<span class="cart-badge" id="cartBadge">0</span></a>
  </div>
</header>

<main class="wrap wishlist-page">
  <h1>Избранное</h1>
  <div id="grid" class="grid"><div class="state-msg">Загружаем избранное…</div></div>
</main>

<script type="module">
  import { api } from './js/api.js';
  import { initHeader } from './js/header.js';
  import { initWidgets } from './js/widgets.js';

  initHeader();
  initWidgets();

  const grid = document.getElementById('grid');
  const fmt = n => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';

  async function load() {
    if (!api.isLoggedIn()) {
      grid.innerHTML = `<div class="state-msg">Войдите, чтобы видеть избранное. <a href="login.html" style="color:var(--gold)">Войти →</a></div>`;
      return;
    }
    try {
      const data = await api.getWishlist();
      const items = Array.isArray(data) ? data : (data.results || []);
      render(items);
    } catch (err) {
      grid.innerHTML = `<div class="state-msg error">Не удалось загрузить избранное: ${err.message || 'ошибка сервера'}</div>`;
    }
  }

  function render(items) {
    if (!items.length) {
      grid.innerHTML = `<div class="state-msg">Пока пусто. <a href="index.html" style="color:var(--gold)">В каталог →</a></div>`;
      return;
    }
    grid.innerHTML = '';
    items.forEach(entry => {
      const p = entry.product && entry.product.id ? entry.product : entry;
      const image = p.image || `https://picsum.photos/seed/w${p.id}/600/750`;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.entryId = entry.id;
      card.innerHTML = `
        <div class="card-media">
          <a href="product.html?id=${p.id}"><img src="${image}" alt="${p.name || p.title}" loading="lazy"></a>
          <button class="wish-btn active" data-entry-id="${entry.id}">♥</button>
        </div>
        <div class="card-body">
          <a href="product.html?id=${p.id}" class="card-title" style="color:inherit;">${p.name || p.title}</a>
          <div class="card-footer"><div class="card-price">${fmt(p.price)}</div></div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  grid.addEventListener('click', async (e) => {
    if (!e.target.classList.contains('wish-btn')) return;
    const card = e.target.closest('.card');
    const entryId = e.target.dataset.entryId;
    card.style.transition = 'opacity .35s ease, transform .35s ease';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.92)';
    try {
      await api.removeWishlist(entryId);
    } catch (_) { /* удаляем визуально в любом случае, при ошибке просто перезагрузим */ }
    setTimeout(() => {
      card.remove();
      if (!grid.children.length) load();
    }, 350);
  });

  load();
</script>

</body>
</html>
